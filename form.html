<html>
    <head>
        <tittle>
            Praktek Form
        </tittle>
    </head>
    <body>
        <h2>Form Pendaftaran SPMB</h2>
        <form>
            <table>
                <tr>

                    <td><label>Nama Lengkap</label></td>
                    <td>:</td>
                    <td> <input type="text" required placeholder="masukkan Nama"><br></td>
                </tr>
                <tr>
                    <td><label>No HP</label></td>
                    <td>:</td>
                    <td><input type="number"><br></td>
                </tr>
            </table>
            
            <label>Tanggal Lahir</label>
            <input type="date"><br>
            <label>Email</label>
            <input type="email"><br>
            <label>Password</label>
            <input type="password"><br>
            <label>Jenis kelamin</label>
            <input type="radio" name="jeniskelamin" value="L">Laki-laki
            <input type="radio" name="jeniskelamin" value="P">Perempuan<br>
            <label>Sub Organ</label><br>
            <input type="checkbox" name="suborgan" value="">MAC<br>
            <input type="checkbox" name="suborgan" value="">IRC<br>
            <input type="checkbox" name="suborgan" value="">BDI<br>
            <input type="checkbox" name="suborgan" value="">Memo<br>
            <input type="checkbox" name="suborgan" value="">Metic<br>
            <input type="checkbox" name="suborgan" value="">Comet<br>
            <input type="checkbox" name="suborgan" value="">Palwaga<br>
            <label>Jurusan</label>
            <select name="jurusan">
                <option value="">Pilih Jur</option>
                <option value="rpl">RPL</option>
                <option value="tkj">TKJ</option>
                <option value="pg">PG</option>
            </select><br>
            <label>Alamat</label>
            <textarea placeholder="Alamat"></textarea><br>
            <label>Upload Foto</label>
            <input type="file"><br>

            <button type="submit">Kirim</button>
        
        </form>
    </body>
</html>
